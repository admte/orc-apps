name: CI

on:
  push:
    branches: [main]
    tags:
      - '*/*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, '/')
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install orc-artifact
        run: go install github.com/admte/orc-artifact/cmd/orc-artifact@latest

      - name: Parse release tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          app="${ref%%/*}"
          version="${ref#*/}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | orc-artifact login -u "${{ github.actor }}" -password-stdin ghcr.io

      - name: Push app artifact
        run: |
          app="${{ steps.tag.outputs.app }}"
          version="${{ steps.tag.outputs.version }}"
          orc-artifact push "ghcr.io/admte/${app}:${version},default" "apps/${app}/app.config.v1.json" $(find "apps/${app}" -type f ! -name 'app.config.v1.json' -print)
