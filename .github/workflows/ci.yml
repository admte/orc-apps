name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build apps
    runs-on: precision32c16m
    steps:
      - uses: actions/checkout@v5
      - name: Install orc
        # orc-cli is a private repo; GH_TOKEN secret is a PAT with read access to admte/orc-cli.
        run: ./scripts/install.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Build every app (validates artifact.yaml + config schema)
        run: |
          for dir in apps/*/; do
            app=$(basename "$dir")
            echo "::group::build $app"
            ./orc build "$dir" --output "/tmp/oci-$app"
            echo "::endgroup::"
          done
      - name: Verify embedded recipe round-trips (byte-identical artifact.yaml)
        run: |
          for dir in apps/*/; do
            app=$(basename "$dir")
            layout="/tmp/oci-$app"
            ref=$(jq -r '.manifests[] | select(.artifactType=="application/vnd.orc8r.recipe.v1") | .digest' "$layout/index.json")
            if [ -z "$ref" ]; then echo "::error::$app: no recipe referrer in OCI layout"; exit 1; fi
            recipe=$(jq -r '.layers[0].digest' "$layout/blobs/sha256/${ref#sha256:}")
            if ! diff -q "$layout/blobs/sha256/${recipe#sha256:}" "$dir/artifact.yaml" >/dev/null; then
              echo "::error::$app: embedded recipe is not byte-identical to artifact.yaml"; exit 1
            fi
            echo "$app: recipe round-trip OK"
          done
