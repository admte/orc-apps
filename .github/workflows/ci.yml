name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install orc
        # orc-cli is a private repo; GH_TOKEN secret is a PAT with read access to admte/orc-cli.
        run: ./scripts/install.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Build every app (validates artifact.yaml + config schema)
        run: |
          for dir in apps/*/; do
            app=$(basename "$dir")
            echo "::group::build $app"
            ./orc build "$dir" --output "/tmp/oci-$app"
            echo "::endgroup::"
          done
