artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: postgres
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: PostgreSQL 17 as a managed service; slot 1 is the writer, other slots stream from it
config:
  params:
    type: object
    required: [password]
    properties:
      password:
        type: string
        title: Application password
        description: Password of the application role; clients present it over TLS
        sensitive: true
      app_user:
        type: string
        title: Application role
        description: Login role created for the application
        default: app
      app_db:
        type: string
        title: Application database
        description: Database created for the application, owned by the application role
        default: app
      max_connections:
        type: string
        title: Max connections
        description: PostgreSQL max_connections, a positive integer
        default: "100"
      # Everything below is filled in by the platform and hidden from operators.
      #
      # The node's runtime slot decides its mode: slot 1 initializes and serves as the
      # writer, every other slot rebuilds itself from the writer on each start.
      slot:
        type: string
        title: Pool slot
        x-source:
          kind: pool.slot
      pool:
        type: string
        title: Pool name
        x-source:
          kind: pool.name
      # The writer's own internal name (the pool's slot-1 name). Replicas stream from
      # it; the name is fenced, so while no slot-1 member is online it answers empty
      # and a replica keeps retrying rather than seeding from a substitute.
      writer:
        type: string
        title: Writer address
        x-source:
          kind: peers.first
      # The project's trust chain. It is the server's ssl_ca_file, which is what
      # authenticates a replica's client certificate, and the root a replica verifies
      # the writer against.
      ca:
        type: string
        title: CA bundle
        contentMediaType: application/x-pem-file
        x-source:
          kind: ca.bundle
      # The listener's certificate, valid for the pool's spread name and this node's
      # own slot name; a replica dials the writer by its slot name with verify-full.
      server_cert:
        type: string
        title: Server certificate
        contentMediaType: application/x-pem-file
        x-source:
          kind: tls.cert
          params:
            purpose: server_tls
      server_key:
        type: string
        title: Server key
        contentMediaType: application/x-pem-file
        x-source:
          kind: tls.key
          params:
            pair: server_cert
      # The replica's identity towards the writer. Replication is authenticated by
      # this certificate alone, so no replication secret is shared across the pool.
      client_cert:
        type: string
        title: Replication client certificate
        contentMediaType: application/x-pem-file
        x-source:
          kind: tls.cert
          params:
            purpose: client_mtls
      client_key:
        type: string
        title: Replication client key
        contentMediaType: application/x-pem-file
        x-source:
          kind: tls.key
          params:
            pair: client_cert
  # One listener. `primary` keeps the pool's canonical name on the writer alone, so a
  # client that resolves the bare pool name always reaches the member that takes
  # writes; slot names still reach individual replicas for reads.
  endpoints:
    pg:
      port: 5432
      serve: primary
  # Packages only, from the PGDG repository. Nothing here is node identity or data, so
  # a pool bake can run install alone and snapshot the disk: initdb, roles, and the
  # replica seed all belong to start.
  install:
    timeout: 15m
  # Runtime-managed service, resolved from start-postgres.sh. The script stages the
  # TLS material, initializes or repairs the cluster for its slot, and execs the
  # postmaster under the postgres account, so the service's main pid is PostgreSQL.
  start:
    service: postgres
    restart: on-failure
  # SIGINT is PostgreSQL's fast shutdown: sessions are disconnected, a checkpoint is
  # written, and the postmaster exits. The grace bounds that checkpoint; a kill past it
  # costs crash recovery on the next start, never data.
  stop:
    signal: SIGINT
    timeout: 30s
    grace: 120s
  # Only the writer's data lives in the persisted root: slot 1 keeps its cluster there,
  # replicas keep theirs outside it, so a replica's capture holds nothing and a
  # restored slot-1 member comes back with its data. A capture is a filesystem
  # snapshot; the hook forces a checkpoint first so recovery after restore is short.
  # The postmaster's pid file is never captured: a restored one would only be stale.
  persist:
    paths:
      - /var/lib/orc-postgres/primary
      - "!**/postmaster.pid"
    hook_pre:
      command: sh hook-pre-postgres.sh
      timeout: 5m
  # Packages plus a replica's copy of the data, which lives on the OS disk.
  footprint_gb: 2
files:
  - postgres-common.sh
  - install-postgres.sh
  - start-postgres.sh
  - hook-pre-postgres.sh
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
