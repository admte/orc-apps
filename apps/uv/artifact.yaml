artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: uv
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install the uv Python package manager
config:
  versions:
    source: github_releases
    url: https://github.com/astral-sh/uv
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  install:
    command: "{installCommand}"
files:
  - install-uv-unix.sh
  - install-uv.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-uv-unix.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars: &windows
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-uv.ps1
  - os: windows
    arch: arm64
    vars: *windows
