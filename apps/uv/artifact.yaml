artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: uv
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install the uv Python package manager
config:
  versions:
    source: github_releases
    url: https://github.com/astral-sh/uv
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  # Without a version (the `default` tag) install fetches the latest release, and
  # leaves a uv that is already installed as it is.
  install:
    command:
      unix: ["./install-uv-unix.sh", "--version=${version}"]
      windows: ["install-uv.ps1", "-Version:${version}"]
  # Windows installs for every user, into one directory on the machine PATH, which
  # uninstall removes again.
  uninstall:
    command:
      unix: []
      windows: ["uninstall-uv.ps1"]
files:
  - install-uv-unix.sh
  - install-uv.ps1
  - uninstall-uv.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
