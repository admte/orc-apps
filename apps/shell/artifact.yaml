artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: shell
  # org.opencontainers.image.version: 1.0.1   # optional; omitted -> tag "default"
  org.opencontainers.image.description: Run an arbitrary shell command
config:
  params:
    type: object
    required: []
    properties:
      # A media type makes the command a file: it reaches start as ${cmd_file}, a path.
      cmd:
        type: string
        description:
          unix: Command to execute (POSIX shell syntax)
          windows: Command to execute (cmd.exe syntax)
        contentMediaType: {unix: text/x-sh, windows: text/plain}
      # No default: when unset, the command runs in the directory start runs in.
      dir:
        type: string
        description: Working directory
  # Runs the command once, in the foreground, and ends with it. On Windows -Dir comes
  # last: an empty `-Dir:` followed by another argument would take that argument as its
  # value, while a trailing one binds as not passed.
  start:
    command:
      unix: ["./start-shell.sh", "--dir=${dir}", "--cmd-file=${cmd_file}"]
      windows: ["start-shell.ps1", "-CmdFile:${cmd_file}", "-Dir:${dir}"]
files:
  - start-shell.sh
  - start-shell.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
