artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: cursor
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and run Cursor CLI
config:
  params:
    type: object
    required: []
    properties:
      cursor_api_key:
        type: string
        title: Cursor API key
        description: Optional API key used by Cursor CLI
        sensitive: true
        lifetime: startup
  install:
    command:
      unix: ["./install-cursor.sh"]
      windows: ["install-cursor.ps1"]
  # Checks the CLI and, when an API key is given, that it authenticates; the key
  # reaches the script only as the path of its file.
  start:
    command:
      unix: ["./start-cursor.sh", "--api-key-file=${cursor_api_key_file}"]
      windows: ["start-cursor.ps1", "-ApiKeyFile:${cursor_api_key_file}"]
files:
  - install-cursor.sh
  - start-cursor.sh
  - install-cursor.ps1
  - start-cursor.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
