artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: node
  org.opencontainers.image.description: Node.js JavaScript runtime
  org.opencontainers.image.source: https://nodejs.org
config:
  versions:
    source: json
    url: https://nodejs.org/dist/index.json
    field: version
    filter:
      pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
      latest_per: minor
      limit: 30
  # Each release installs into its own directory, so install and uninstall both
  # name the version they act on.
  install:
    command:
      unix: ["./install-node.sh", "--version=${version}"]
      windows: ["install-node.ps1", "-Version:${version}"]
  uninstall:
    command:
      unix: ["./uninstall-node.sh", "--version=${version}"]
      windows: ["uninstall-node.ps1", "-Version:${version}"]
files:
  - install-node.sh
  - uninstall-node.sh
  - install-node.ps1
  - uninstall-node.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
