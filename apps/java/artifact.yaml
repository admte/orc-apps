artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: java
  org.opencontainers.image.description: Eclipse Temurin JDK from Adoptium
  org.opencontainers.image.source: https://adoptium.net
config:
  versions:
    source: json
    # Adoptium builds each platform on its own schedule, so a release can exist
    # for Linux and not yet for Windows: 27.0.1 is Linux only today. Ask for the
    # versions Windows x64 has, the narrowest of this app's platforms, so the
    # catalog never offers one that a node here cannot install.
    url: "https://api.adoptium.net/v3/info/release_versions?release_type=ga&vendor=eclipse&os=windows&architecture=x64&image_type=jdk&sort_method=DEFAULT&sort_order=DESC&page_size=50"
    select: /versions
    field: semver
    filter:
      # Adoptium appends the build after "+", which is not valid in a tag.
      pattern: '^(?P<version>\d+\.\d+\.\d+)\+.*$'
      latest_per: minor
      limit: 30
  # Each release installs into its own directory. Without a version (the
  # `default` tag) install takes the newest release Adoptium publishes, and
  # uninstall removes the release the current link points at.
  install:
    command:
      unix: ["./install-java.sh", "--version=${version}"]
      windows: ["install-java.ps1", "-Version:${version}"]
  uninstall:
    command:
      unix: ["./uninstall-java.sh", "--version=${version}"]
      windows: ["uninstall-java.ps1", "-Version:${version}"]
files:
  - install-java.sh
  - uninstall-java.sh
  - install-java.ps1
  - uninstall-java.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
