artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: java
  org.opencontainers.image.description: Eclipse Temurin JDK from Adoptium
  org.opencontainers.image.source: https://adoptium.net
config:
  versions:
    source: json
    url: "https://api.adoptium.net/v3/info/release_versions?release_type=ga&vendor=eclipse&sort_method=DEFAULT&sort_order=DESC&page_size=50"
    select: /versions
    field: semver
    filter:
      # Adoptium appends the build after "+", which is not valid in a tag.
      pattern: '^(?P<version>\d+\.\d+\.\d+)\+.*$'
      latest_per: minor
      limit: 30
files:
  - install-java.sh
  - uninstall-java.sh
  - install-java.ps1
  - uninstall-java.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
