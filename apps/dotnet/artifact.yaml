artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: dotnet
  org.opencontainers.image.description: .NET SDK from Microsoft's published archives
  org.opencontainers.image.source: https://dotnet.microsoft.com
config:
  versions:
    source: json
    # Microsoft's release index: one entry per .NET band, naming that band's
    # newest SDK and pointing at the band's own metadata file. The install phase
    # starts from this same document — it asks the index which band publishes the
    # chosen version rather than deriving it, because at least one band does not
    # match its versions (2.1.202 is published under 2.0) — and takes the
    # download URL and the SHA-512 from the band file it points to.
    url: https://builds.dotnet.microsoft.com/dotnet/release-metadata/releases-index.json
    select: /releases-index
    field: latest-sdk
    filter:
      # Two jobs. It drops the preview and release-candidate bands, whose
      # versions carry a suffix. And it starts at 5, because that is the first
      # release with archives for every platform declared below: the 3.1, 3.0,
      # 2.2 and 2.1 bands publish no Windows arm64 SDK, and the 1.x bands name
      # their archives differently again (dotnet-dev-ubuntu-x64.1.1.14.tar.gz).
      # `go` draws the same line at 1.17 for the same reason.
      pattern: '^(?P<version>([5-9]|[1-9][0-9])\.\d+\.\d+)$'
      # Each band contributes its newest SDK, which is what this feed publishes
      # anyway; declared so two bands that happen to name the same SDK cannot
      # both reach the list. There is no endpoint listing every patch — the full
      # versions live two levels deep in the per-band files, out of reach of a
      # pointer — so what is offered is the newest build of each line.
      latest_per: minor
      limit: 30
  # The archive is a few hundred megabytes, and a node missing ICU has a package
  # install on top of that.
  install:
    timeout: 1200s
  uninstall: {}
files:
  - install-dotnet.sh
  - uninstall-dotnet.sh
  - install-dotnet.ps1
  - uninstall-dotnet.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
