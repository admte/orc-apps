artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: jfrog
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure JFrog CLI
config:
  params:
    type: object
    required: []
    properties:
      jfrog_url:
        type: string
        title: JFrog URL
        description: Optional JFrog Platform base URL
        placeholder: https://example.jfrog.io
      jfrog_user:
        type: string
        title: JFrog user
        description: Optional JFrog username
      jfrog_token:
        type: string
        title: JFrog access token
        description: Optional JFrog access token used for authentication
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/jfrog/jfrog-cli
    filter:
      prerelease: false
      pattern: "^2\\.[0-9.]+$"
      limit: 30
  install:
    command: "{installCommand}"
  start:
    command: "{startCommand}"
files:
  - install-jfrog.sh
  - start-jfrog.sh
  - install-jfrog.ps1
  - start-jfrog.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-jfrog.sh
      startCommand: sh start-jfrog.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars:
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-jfrog.ps1
      startCommand: powershell -NoProfile -ExecutionPolicy Bypass -File start-jfrog.ps1
