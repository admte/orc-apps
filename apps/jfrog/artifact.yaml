artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: jfrog
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure JFrog CLI
config:
  params:
    type: object
    required: []
    x-ui-order: [jfrog_url, jfrog_user, jfrog_token]
    properties:
      jfrog_url:
        type: string
        title: JFrog URL
        description: Optional JFrog Platform base URL
        placeholder: https://example.jfrog.io
      jfrog_user:
        type: string
        title: JFrog user
        description: Optional JFrog username
      jfrog_token:
        type: string
        title: JFrog access token
        description: Optional JFrog access token used for authentication
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/jfrog/jfrog-cli
    filter:
      prerelease: false
      pattern: "^2\\.[0-9.]+$"
      limit: 30
  # Without a version (the `default` tag) install takes the latest release.
  install:
    command:
      unix: ["./install-jfrog.sh", "--version=${version}"]
      windows: ["install-jfrog.ps1", "-Version:${version}"]
  # Configures the server when the URL, user and token are given; the token
  # reaches the script only as the path of its file.
  start:
    command:
      unix: ["./start-jfrog.sh", "--url=${jfrog_url}", "--user=${jfrog_user}",
             "--token-file=${jfrog_token_file}"]
      windows: ["start-jfrog.ps1", "-Url:${jfrog_url}", "-User:${jfrog_user}",
                "-TokenFile:${jfrog_token_file}"]
files:
  - install-jfrog.sh
  - start-jfrog.sh
  - install-jfrog.ps1
  - start-jfrog.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
