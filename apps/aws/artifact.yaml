artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: aws
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure AWS CLI v2
config:
  params:
    type: object
    required: []
    properties:
      aws_access_key_id:
        type: string
        title: AWS access key ID
        description: Optional AWS access key ID
        sensitive: true
        lifetime: startup
      aws_secret_access_key:
        type: string
        title: AWS secret access key
        description: Optional AWS secret access key
        sensitive: true
        lifetime: startup
  versions:
    # aws/aws-cli tags every release but publishes no GitHub releases,
    # so tags are the only enumerable source.
    source: github_tags
    url: https://github.com/aws/aws-cli
    filter:
      pattern: "^2\\.[0-9.]+$"
      limit: 30
  # Without a version (the `default` tag) install takes the latest release.
  install:
    command:
      unix: ["./install-aws.sh", "--version=${version}"]
      windows: ["install-aws.ps1", "-Version:${version}"]
  # Signs in the CLI's default profile when both keys are given; the keys reach
  # the script only as the paths of their files.
  start:
    command:
      unix: ["./start-aws.sh", "--access-key-id-file=${aws_access_key_id_file}",
             "--secret-access-key-file=${aws_secret_access_key_file}"]
      windows: ["start-aws.ps1", "-AccessKeyIdFile:${aws_access_key_id_file}",
                "-SecretAccessKeyFile:${aws_secret_access_key_file}"]
files:
  - install-aws.sh
  - start-aws.sh
  - install-aws.ps1
  - start-aws.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
