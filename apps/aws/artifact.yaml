artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: aws
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure AWS CLI v2
config:
  params:
    type: object
    required: []
    properties:
      aws_access_key_id:
        type: string
        title: AWS access key ID
        description: Optional AWS access key ID
        sensitive: true
        lifetime: startup
      aws_secret_access_key:
        type: string
        title: AWS secret access key
        description: Optional AWS secret access key
        sensitive: true
        lifetime: startup
  install:
    command: "{installCommand}"
  start:
    command: "{startCommand}"
files:
  - install-aws.sh
  - start-aws.sh
  - install-aws.ps1
  - start-aws.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-aws.sh
      startCommand: sh start-aws.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars:
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-aws.ps1
      startCommand: powershell -NoProfile -ExecutionPolicy Bypass -File start-aws.ps1
