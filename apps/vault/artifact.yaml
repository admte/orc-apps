artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: vault
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure the HashiCorp Vault CLI
config:
  params:
    type: object
    required: []
    properties:
      vault_addr:
        type: string
        title: Vault address
        description: Optional URL of the Vault server
        placeholder: https://vault.example.com
      vault_role_id:
        type: string
        title: Vault AppRole role ID
        description: Optional AppRole role ID used for startup authentication
        sensitive: true
        lifetime: startup
      vault_secret_id:
        type: string
        title: Vault AppRole secret ID
        description: Optional AppRole secret ID for roles that require it
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/hashicorp/vault
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  # Without a version (the `default` tag) install takes the latest release, and
  # leaves a vault command that is already on PATH as it is.
  install:
    command:
      unix: ["./install-vault-unix.sh", "--version=${version}"]
      windows: ["install-vault.ps1", "-Version:${version}"]
  # Signs the CLI in with AppRole when a role ID is given. The script sets
  # VAULT_ADDR from --addr itself, since the vault CLI reads the server address
  # from it; the IDs reach the script only as the paths of their files.
  start:
    command:
      unix: ["./start-vault-unix.sh", "--addr=${vault_addr}",
             "--role-id-file=${vault_role_id_file}",
             "--secret-id-file=${vault_secret_id_file}"]
      windows: ["start-vault.ps1", "-Addr:${vault_addr}",
                "-RoleIdFile:${vault_role_id_file}",
                "-SecretIdFile:${vault_secret_id_file}"]
files:
  - install-vault-unix.sh
  - install-vault.ps1
  - start-vault-unix.sh
  - start-vault.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
