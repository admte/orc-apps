artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: vault
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure the HashiCorp Vault CLI
config:
  params:
    type: object
    required: []
    properties:
      vault_addr:
        type: string
        title: Vault address
        description: Optional URL of the Vault server
        placeholder: https://vault.example.com
      vault_role_id:
        type: string
        title: Vault AppRole role ID
        description: Optional AppRole role ID used for startup authentication
        sensitive: true
        lifetime: startup
      vault_secret_id:
        type: string
        title: Vault AppRole secret ID
        description: Optional AppRole secret ID for roles that require it
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/hashicorp/vault
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  install:
    command: "{installCommand}"
  start:
    command: "{startCommand}"
files:
  - install-vault-unix.sh
  - install-vault.ps1
  - start-vault-unix.sh
  - start-vault.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-vault-unix.sh
      startCommand: sh start-vault-unix.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars:
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-vault.ps1
      startCommand: powershell -NoProfile -ExecutionPolicy Bypass -File start-vault.ps1
