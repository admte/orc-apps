artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: gcloud
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure Google Cloud CLI
config:
  params:
    type: object
    required: []
    properties:
      service_account_key:
        type: string
        title: Service account key
        description: Optional Google Cloud service account JSON key
        contentMediaType: application/json
        sensitive: true
        lifetime: startup
  install:
    command:
      unix: ["./install-gcloud.sh"]
      windows: ["install-gcloud.ps1"]
  # Activates the service account when a key is given; the key reaches the
  # script only as the path of its file.
  start:
    command:
      unix: ["./start-gcloud.sh", "--service-account-key-file=${service_account_key_file}"]
      windows: ["start-gcloud.ps1", "-ServiceAccountKeyFile:${service_account_key_file}"]
files:
  - install-gcloud.sh
  - start-gcloud.sh
  - install-gcloud.ps1
  - start-gcloud.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
