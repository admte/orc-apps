artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: gcloud
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure Google Cloud CLI
config:
  params:
    type: object
    required: []
    properties:
      service_account_key:
        type: string
        title: Service account key
        description: Optional Google Cloud service account JSON key
        contentMediaType: application/json
        sensitive: true
        lifetime: startup
  install:
    command: "{installCommand}"
  start:
    command: "{startCommand}"
files:
  - install-gcloud.sh
  - start-gcloud.sh
  - install-gcloud.ps1
  - start-gcloud.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-gcloud.sh
      startCommand: sh start-gcloud.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars:
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-gcloud.ps1
      startCommand: powershell -NoProfile -ExecutionPolicy Bypass -File start-gcloud.ps1
