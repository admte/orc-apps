artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: apt
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install Debian/Ubuntu packages via apt-get
config:
  params:
    type: object
    required: [packages]
    properties:
      packages:
        type: string
        description: Space-separated package names (e.g. git curl htop)
  # Install checks the machine and the package names; start installs them.
  install:
    command: ["./install-apt.sh", "--packages=${packages}"]
  start:
    command: ["./start-apt.sh", "--packages=${packages}"]
files:
  - install-apt.sh
  - start-apt.sh
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
