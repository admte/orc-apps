artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: apt
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install Debian/Ubuntu packages via apt-get
config:
  description: Install Debian/Ubuntu packages via apt-get
  params:
    type: object
    required: [packages]
    properties:
      packages:
        type: string
        description: Space-separated package names (e.g. git curl htop)
  install:
    command: sh install-apt.sh
  start:
    command: sh start-apt.sh
files:
  - install-apt.sh
  - start-apt.sh
platforms:
  - os: linux
    arch: amd64
