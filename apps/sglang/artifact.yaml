artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: sglang
  org.opencontainers.image.description: SGLang inference server, serving one model over an OpenAI-compatible API
  org.opencontainers.image.source: https://github.com/sgl-project/sglang
config:
  params:
    type: object
    required: [model]
    x-ui-order: [model, hf_token]
    properties:
      model:
        type: string
        title: Model
        description: Hugging Face model to serve, or a path on the node. Downloaded on first start, which takes as long as the weights are large.
        placeholder: meta-llama/Llama-3.1-8B-Instruct
      hf_token:
        type: string
        title: Hugging Face token
        description: Needed only for a gated or private model. Created under Settings > Access Tokens with read access.
        sensitive: true
  # Two parameters, and nothing else to ask for. The port is the endpoint's own,
  # the number of GPUs is the node's, and the rest are SGLang's defaults. Adding
  # a parameter later is free; removing one is not.
  versions:
    # github_releases, like terraform and gitlab-runner: the releases are tagged
    # vX.Y.Z and the tag is exactly what `pip install sglang==` takes.
    source: github_releases
    url: https://github.com/sgl-project/sglang
    filter:
      pattern: '^v?(?P<version>\d+\.\d+\.\d+)$'
      prerelease: false
      # No latest_per. For a toolchain the minor is the release axis, so the
      # catalog apps keep the newest patch per minor; here it would offer five
      # versions, four of them years old. Thirty most recent releases instead.
      limit: 30
  endpoints:
    api:
      # SGLang's own default, kept so the package behaves the same run by hand.
      port: 30000
      protocol: http
      # start-sglang.sh defaults to this number; the two have to be changed
      # together, because nothing checks that they agree.
      probe:
        # From 0.5.10 on, /health answers 503 while the server is still starting
        # and while it is shutting down, and 200 in between — which is exactly
        # what readiness needs. On older releases it is a flat 200, so the node
        # would be counted ready as soon as the port opened; see the README.
        http: /health
        interval: 15s
        timeout: 5s
      # Every node holds its own copy of the same model and any of them can serve
      # any request, so there is nothing to keep on one node.
      serve: spread
  # The wheel set and its CUDA payload are gigabytes.
  install:
    timeout: 3600s
  start:
    service: sglang
    restart: on-failure
  # No stop command: requests here are seconds long, so there is nothing to drain.
  # The signal is the default SIGTERM, which is what the server shuts down on;
  # only the grace is declared, because unloading a large model off the GPUs
  # takes longer than the default ten seconds.
  stop:
    grace: 60s
  uninstall: {}
files:
  - install-sglang.sh
  - start-sglang.sh
  - uninstall-sglang.sh
platforms:
  # SGLang publishes manylinux wheels for both x86-64 and aarch64 — the latter is
  # what the Grace-Hopper class of NVIDIA node runs.
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
