artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: claude
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure Claude Code
config:
  params:
    type: object
    required: []
    properties:
      anthropic_api_key:
        type: string
        title: Anthropic API key
        description: Optional API key used by Claude Code
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/anthropics/claude-code
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  install:
    command: "{installCommand}"
  start:
    command: "{startCommand}"
files:
  - install-claude.sh
  - start-claude.sh
  - install-claude.ps1
  - start-claude.ps1
platforms:
  - os: linux
    arch: amd64
    vars: &unix
      installCommand: sh install-claude.sh
      startCommand: sh start-claude.sh
  - os: linux
    arch: arm64
    vars: *unix
  - os: darwin
    arch: amd64
    vars: *unix
  - os: darwin
    arch: arm64
    vars: *unix
  - os: windows
    arch: amd64
    vars: &windows
      installCommand: powershell -NoProfile -ExecutionPolicy Bypass -File install-claude.ps1
      startCommand: powershell -NoProfile -ExecutionPolicy Bypass -File start-claude.ps1
  - os: windows
    arch: arm64
    vars: *windows
