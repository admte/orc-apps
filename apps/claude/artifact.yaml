artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: claude
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure Claude Code
config:
  params:
    type: object
    required: []
    properties:
      anthropic_api_key:
        type: string
        title: Anthropic API key
        description: Optional API key used by Claude Code
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/anthropics/claude-code
    filter:
      prerelease: false
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  # Without a version (the `default` tag) install takes the latest release.
  install:
    command:
      unix: ["./install-claude.sh", "--version=${version}"]
      windows: ["install-claude.ps1", "-Version:${version}"]
  # Writes the API key into Claude Code's settings when one is given; the key
  # reaches the script only as the path of its file.
  start:
    command:
      unix: ["./start-claude.sh", "--api-key-file=${anthropic_api_key_file}"]
      windows: ["start-claude.ps1", "-ApiKeyFile:${anthropic_api_key_file}"]
files:
  - install-claude.sh
  - start-claude.sh
  - install-claude.ps1
  - start-claude.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
