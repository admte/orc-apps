artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: codex
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Install and configure OpenAI Codex CLI
config:
  params:
    type: object
    required: []
    properties:
      openai_api_key:
        type: string
        title: OpenAI API key
        description: Optional API key used by Codex CLI
        sensitive: true
        lifetime: startup
  versions:
    source: github_releases
    url: https://github.com/openai/codex
    filter:
      prerelease: false
      pattern: "^(rust-v)?[0-9]+\\.[0-9]+\\.[0-9]+$"
      limit: 30
  # Without a version (the `default` tag) install takes the latest release.
  install:
    command:
      unix: ["./install-codex.sh", "--version=${version}"]
      windows: ["install-codex.ps1", "-Version:${version}"]
  # Signs the CLI in when an API key is given; the key reaches the script only as
  # the path of its file.
  start:
    command:
      unix: ["./start-codex.sh", "--api-key-file=${openai_api_key_file}"]
      windows: ["start-codex.ps1", "-ApiKeyFile:${openai_api_key_file}"]
files:
  - install-codex.sh
  - start-codex.sh
  - install-codex.ps1
  - start-codex.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
