artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: github-runner
  # No version: install always downloads the latest runner, and an app's version is the
  # version of the software it installs, never of its manifest or scripts.
  org.opencontainers.image.description: GitHub Actions self-hosted runner
config:
  params:
    type: object
    required: [url, token]
    x-ui-order: [url, token]
    properties:
      url:
        type: string
        title: Repository URL
        description: GitHub repository or organization URL to register the runner with
        placeholder: https://github.com/org/repo
      # Either a personal access token the operator typed, or — when left empty —
      # a registration orc8r mints from the project's Source Control connection,
      # delivered as a JSON object in the same file. The scripts tell them apart
      # by shape. Sensitive, so it reaches a phase only as ${token_file}, a path.
      # `runtime` because stop and stopped read it after start.
      token:
        type: string
        title: GitHub token
        description: >-
          Leave empty to use this project's Source Control connection. Otherwise a
          token that can register runners for the repository.
        sensitive: true
        lifetime: runtime
        x-source:
          kind: github.runner
          params:
            url: url
      labels:
        type: string
        title: Runner labels
        description: Comma-separated labels to register the runner with
        x-source:
          kind: pool.name
  # Downloads and unpacks the runner and nothing else. Registration is the start
  # phase's, because a pool bake runs install alone and snapshots the disk: an
  # identity minted here would be baked into a shared image along with the
  # runner's `.credentials`. It takes no url and no token: the build is the
  # latest public release whatever the node registers with later.
  install:
    command:
      unix: ["./install-github-runner.sh", "--os=${os}", "--arch=${arch}"]
      windows: ["install-github-runner.ps1", "-Arch:${arch}"]
  # Runtime-managed service: the node writes the service definition from this
  # block, so the package never calls svc.sh install or config.cmd
  # --runasservice. A service survives an agent upgrade or crash, which is what
  # keeps a build running across one. The script registers, then execs the
  # listener, so the stop signal reaches the runner itself.
  start:
    service: github-runner
    command:
      unix: ["./start-github-runner.sh", "--url=${url}", "--token-file=${token_file}",
             "--labels=${labels}"]
      windows: ["start-github-runner.ps1", "-Url:${url}", "-TokenFile:${token_file}",
                "-Labels:${labels}"]
  # SIGINT is what the Actions listener reads as "finish this job, then exit", so
  # it is the signal the generated service definition carries. The command has
  # already waited for the job by the time it is sent; the hour is the cap on
  # that wait.
  stop:
    signal: SIGINT
    timeout: 1h
    grace: 30s
    command:
      unix: ["./stop-github-runner.sh", "--url=${url}", "--token-file=${token_file}",
             "--labels=${labels}"]
      windows: ["stop-github-runner.ps1", "-Url:${url}", "-TokenFile:${token_file}",
                "-Labels:${labels}"]
  # Releases a registration made with a personal access token, and only when the
  # node is ending for good. orc8r removes a registration it minted itself.
  stopped:
    timeout: 120s
    command:
      unix: ["./stopped-github-runner.sh", "--url=${url}", "--token-file=${token_file}",
             "--stop-reason=${stop_reason}"]
      windows: ["stopped-github-runner.ps1", "-Url:${url}", "-TokenFile:${token_file}",
                "-StopReason:${stop_reason}"]
files:
  - install-github-runner.sh
  - start-github-runner.sh
  - stop-github-runner.sh
  - stopped-github-runner.sh
  - install-github-runner.ps1
  - start-github-runner.ps1
  - stop-github-runner.ps1
  - stopped-github-runner.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
