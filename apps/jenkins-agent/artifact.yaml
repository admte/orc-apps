artifactType: application/vnd.orc8r.app.v2
annotations:
  org.opencontainers.image.title: jenkins-agent
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Jenkins Swarm agent connecting to a Jenkins controller
config:
  params:
    type: object
    required: [jenkins_url, jenkins_username, jenkins_password]
    x-ui-order: [jenkins_url, jenkins_username, jenkins_password]
    properties:
      jenkins_url:
        type: string
        title: Jenkins URL
        description: URL of the Jenkins controller
        placeholder: https://jenkins.example.com
      jenkins_username:
        type: string
        title: Username
        description: Jenkins username for Swarm agent authentication
      jenkins_password:
        type: string
        title: Password
        description: Jenkins API token or password
        sensitive: true
      labels:
        type: string
        title: Labels
        description: Space-separated labels for the Swarm agent
        x-source:
          kind: pool.name
      # Extra CA certificates, so both halves of the agent can verify a controller
      # served with a privately issued certificate: the HTTP calls and the JVM the
      # Swarm client runs in. A file because of contentMediaType, so it reaches a
      # phase only as ${tls_ca_file}, a path. Optional, and trusted alongside the
      # system CAs rather than instead of them, so a publicly trusted controller,
      # or a plain http:// one, keeps working with or without it.
      tls_ca:
        type: string
        title: TLS CA bundle
        contentMediaType: application/x-pem-file
        x-source:
          kind: ca.bundle
  # Lays out the agent directory, the password file the Swarm client re-reads on
  # every restart, and a copy of the runner at a fixed path. The password reaches
  # it only as ${jenkins_password_file}, a path.
  install:
    command:
      unix: ["./install-jenkins-agent.sh", "--url=${jenkins_url}",
             "--username=${jenkins_username}", "--password-file=${jenkins_password_file}"]
      windows: ["install-jenkins-agent.ps1", "-Url:${jenkins_url}",
                "-Username:${jenkins_username}", "-PasswordFile:${jenkins_password_file}"]
  # Managed service: the service definition is generated from this block, so the
  # package ships no unit file, registers nothing with the SCM, and never enables
  # anything for boot. The start command plus the `service` name is what makes it
  # a managed service: the script runs in the foreground as the service's main
  # process.
  #
  # On Linux the start script drops to the jenkins account with setpriv (never su or
  # runuser), inside the same session, so the Swarm client stays the service's own
  # process and the stop signal reaches it. The runner re-reads the password file --
  # and rebuilds the CA trust material -- on every restart, which is what keeps a
  # short-lived certificate working across a renewal.
  start:
    service: jenkins-agent
    restart: always
    command:
      unix: ["./start-jenkins-agent.sh", "--url=${jenkins_url}",
             "--username=${jenkins_username}", "--labels=${labels}",
             "--tls-ca-file=${tls_ca_file}"]
      windows: ["start-jenkins-agent.ps1", "-Url:${jenkins_url}",
                "-Username:${jenkins_username}", "-Labels:${labels}",
                "-TlsCaFile:${tls_ca_file}"]
  # stop-jenkins-agent.{sh,ps1} marks the agent offline and waits for its build; the
  # timeout is a long build, the grace is the JVM's own shutdown.
  stop:
    timeout: 30m
    grace: 30s
    command:
      unix: ["./stop-jenkins-agent.sh", "--url=${jenkins_url}",
             "--username=${jenkins_username}", "--tls-ca-file=${tls_ca_file}",
             "--stop-reason=${stop_reason}"]
      windows: ["stop-jenkins-agent.ps1", "-Url:${jenkins_url}",
                "-Username:${jenkins_username}", "-TlsCaFile:${tls_ca_file}",
                "-StopReason:${stop_reason}"]
files:
  - install-jenkins-agent.sh
  - start-jenkins-agent.sh
  - stop-jenkins-agent.sh
  - run-jenkins-agent.sh
  - jenkins-agent-common.sh
  - install-jenkins-agent.ps1
  - start-jenkins-agent.ps1
  - stop-jenkins-agent.ps1
  - run-jenkins-agent.ps1
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
