artifactType: application/vnd.orc8r.app.v1
annotations:
  org.opencontainers.image.title: jenkins-agent
  # org.opencontainers.image.version: 1.0.0    # optional; omitted -> tag "default"
  org.opencontainers.image.description: Jenkins Swarm agent connecting to a Jenkins controller
config:
  params:
    type: object
    required: [jenkins_url, jenkins_username, jenkins_password]
    x-ui-order: [jenkins_url, jenkins_username, jenkins_password]
    properties:
      jenkins_url:
        type: string
        title: Jenkins URL
        description: URL of the Jenkins controller
        placeholder: https://jenkins.example.com
      jenkins_username:
        type: string
        title: Username
        description: Jenkins username for Swarm agent authentication
      jenkins_password:
        type: string
        title: Password
        description: Jenkins API token or password
        sensitive: true
      labels:
        type: string
        title: Labels
        description: Swarm agent labels; sourced from the pool name.
        x-source:
          kind: pool.name
  install: {}
  # Runtime-managed service: the node writes the systemd unit from this block, so
  # the package ships no unit file and never enables anything for boot. setpriv
  # (never su or runuser) drops to the jenkins account inside the same session, so
  # the Swarm client stays the service's own process and the stop signal reaches
  # it. The runner re-reads the password file on every restart.
  start:
    command: >-
      exec setpriv --reuid=jenkins --regid=jenkins --init-groups
      env HOME=/var/lib/jenkins-agent
      /etc/jenkins-agent/jenkins-agent.sh
      "$JENKINS_URL" "$JENKINS_USERNAME" /var/lib/jenkins-agent/jenkins.password
      "$(hostname)" "$LABELS" /var/lib/jenkins-agent
      /var/lib/jenkins-agent/logging.properties
    service: jenkins-agent
    restart: always
  # stop-jenkins-agent.sh marks the agent offline and waits for its build; the
  # timeout is a long build, the grace is the JVM's own shutdown.
  stop:
    timeout: 30m
    grace: 30s
files:
  - install-jenkins-agent.sh
  - stop-jenkins-agent.sh
  - run-jenkins-agent.sh
  - jenkins-agent-common.sh
platforms:
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
